name: Secret scan

# Scans the commits of every push and pull request for credentials (API keys, private keys, tokens,
# connection strings with passwords) with gitleaks, and fails the run if one is found. It looks at the
# new commits only, so a secret that is already in the history does not fail every run: such a secret
# must be rotated, not just deleted.

on:
  push:
    branches: [ develop, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Scan for secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
