name: Publish master NuGet Package

on:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PREFIXES: 'IRI.Maptor.Core IRI.Maptor.Infrastructure IRI.Maptor.Presentation'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'
  NOWARN_CODES: 'CS1591;CS1573;CS0618;NU5104;CS8600;CS0414;CS8601;CS8603'  

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      shell: pwsh
      run: |
        $patterns = "${{ env.PROJECT_PREFIXES }}".Split(' ') | ForEach-Object { "$_*.csproj" }
        Get-ChildItem -Path ./src -Recurse -Include $patterns | ForEach-Object {
          dotnet restore $_.FullName --source ${{ env.NUGET_SOURCE }}
        }

    - name: Build
      run: |
        $noWarn = "${{ env.NOWARN_CODES }}".Replace(';', '%3B')
        $prefixes = "${{ env.PROJECT_PREFIXES }}".Split(' ')
        foreach ($prefix in $prefixes) {
          Get-ChildItem -Path ./src -Recurse -Filter "${prefix}*.csproj" | ForEach-Object {
            dotnet build $_.FullName `
              --configuration Release `
              --no-restore `
              /p:NoWarn=$noWarn `
              /p:WarningLevel=0 `
              --verbosity minimal
          }
        }
        
    # The test project lives in ./tests (not ./src) and is named IRI.Maptor.Tests.csproj, so the
    # previous glob over ./src for "<prefix>*.Tests.csproj" never matched anything and this step
    # silently ran zero tests. It restores and builds on its own: the Build step above only covers
    # the packable projects under ./src.
    #
    # continue-on-error is deliberate. The suite currently has a known baseline of failing
    # round-trip tests (GeoJson / Esri / Dxf / Mvt); making this gate the release would block every
    # publish. Remove continue-on-error once that baseline is green.
    - name: Test
      continue-on-error: true
      run: |
        dotnet test ./tests/IRI.Maptor.Tests/IRI.Maptor.Tests.csproj --configuration Release --verbosity normal

    - name: Pack
      run: |
        $output = "${{ github.workspace }}/nupkgs"
        New-Item -ItemType Directory -Force -Path $output | Out-Null
        $prefixes = "${{ env.PROJECT_PREFIXES }}".Split(' ')
        foreach ($prefix in $prefixes) {
          Get-ChildItem -Path ./src -Recurse -Filter "${prefix}*.csproj" | ForEach-Object {
            dotnet pack $_.FullName --configuration Release --no-build --output $output
          }
        }

    - name: Publish to NuGet
      run: |
        $apiKey = "${{ secrets.NUGET_API_KEY }}"
        Get-ChildItem -Path ./nupkgs -Filter *.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName --source ${{ env.NUGET_SOURCE }} --api-key $apiKey --skip-duplicate
        } 

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: "Maptor v${{ github.run_number }}"
        tag_name: "v${{ github.run_number }}"
        body: |
          📦 Stable NuGet packages for this release:
          ${{ env.PROJECT_PREFIXES }}
        files: ./nupkgs/*.nupkg
